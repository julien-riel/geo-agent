[project]
name = "geo-agent"
version = "0.1.0"
description = "Geo-spatial analysis agent for Montreal WFS data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "lxml>=5.3",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pandas>=2.2",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "copilotkit>=0.1.30",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geo_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that hit live external services (run manually)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
